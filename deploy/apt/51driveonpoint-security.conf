// Nur Sicherheitsupdates werden automatisch eingespielt — alles andere
// (neue Funktionsversionen, Distributions-Upgrades) bleibt eine bewusste,
// manuelle Entscheidung. Eigene Datei statt die von Debian/Ubuntu
// mitgelieferte 50unattended-upgrades zu überschreiben, damit ein
// Systemupdate diese Einstellungen nicht stillschweigend zurücksetzt.
Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
        "${distro_id}ESMApps:${distro_codename}-apps-security";
        "${distro_id}ESM:${distro_codename}-infra-security";
};

Unattended-Upgrade::Remove-Unused-Dependencies "true";

// Ein Neustart nach einem Kernel-Sicherheitsupdate passiert automatisch,
// aber nur nachts um vier — zu einer Zeit, zu der niemand einen Termin
// bucht. Die Container starten danach von selbst wieder mit, weil
// docker-compose.yml für jeden Dienst "restart: unless-stopped" setzt.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "04:00";
